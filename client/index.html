<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shooter Online</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; touch-action: none; }
    canvas { display: block; cursor: crosshair; }

    /* Stili responsivi per la schermata di auth su schermi piccoli */
    @media (max-width: 480px) {
        .auth-card {
            width: 95vw !important;
            padding: 16px !important;
        }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        .auth-container {
            justify-content: flex-start !important;
            padding-top: 10px !important;
            overflow-y: auto !important;
        }
    }

    /* ── LOADER ── */
    #loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Courier New', monospace;
        transition: opacity 0.4s ease;
    }
    #loader-title {
        color: #fff;
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 6px;
        text-transform: uppercase;
    }
    #loader-subtitle {
        color: #555;
        font-size: 0.75rem;
        letter-spacing: 4px;
        margin-top: 8px;
        text-transform: uppercase;
    }
    #loader-bar-wrap {
        margin-top: 24px;
        width: 220px;
        height: 2px;
        background: #1a1a1a;
        border-radius: 2px;
        overflow: hidden;
    }
    #loader-bar {
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 2px;
        transition: width 0.35s ease;
    }
    #loader-status {
        color: #333;
        font-size: 0.65rem;
        letter-spacing: 2px;
        margin-top: 12px;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<!-- Schermata di caricamento -->
<div id="loader">
    <div id="loader-title">Shooter Online</div>
    <div id="loader-subtitle">by andrea perico</div>
    <div id="loader-bar-wrap">
        <div id="loader-bar"></div>
    </div>
    <div id="loader-status">inizializzazione...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
